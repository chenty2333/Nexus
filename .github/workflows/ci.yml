name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: nexus-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quick:
    name: quick feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current portable core, oracle, and host checks
        run: ./x test --quick

  verify:
    name: CSER production recovery verification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install TPM fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends swtpm tpm2-tools xxd
          swtpm --version
          tpm2_nvdefine --version
      - name: Seal guest reply/DMA evidence and four-boot production recovery
        env:
          NEXUS_REBUILD: "1"
        run: ./x verify
      - name: Upload combined CSER production recovery evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-cser-production-${{ github.run_attempt }}
          if-no-files-found: error
          path: kernel/nexus-ostd/artifacts/cser-production
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-cser-production-failure-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            kernel/nexus-ostd/artifacts/cser-production
