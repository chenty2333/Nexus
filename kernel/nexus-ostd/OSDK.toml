# Separate from the five one-vCPU evidence/comparison schemes: this profile
# executes a bounded CPU1 IPI under multi-threaded TCG.
[scheme."cser-smp-smoke"]
build.no_default_features = true
build.features = ["cser-smp-smoke"]
qemu.args = """\
    -nodefaults \
    -machine q35,kernel-irqchip=split \
    -accel tcg,thread=multi \
    -cpu Icelake-Server,+x2apic \
    -m 1G \
    -smp 2 \
    -no-reboot \
    -display none \
    -monitor none \
    -chardev stdio,id=serial0,signal=off \
    -serial chardev:serial0 \
    -chardev file,id=entry-debugcon,path=/work/artifacts/cser-production/smp-smoke-task-entry-debugcon.log \
    -device isa-debugcon,iobase=0xe9,chardev=entry-debugcon \
    -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
    -drive if=pflash,format=raw,unit=0,readonly=on,file=/root/ovmf/release/OVMF.fd \
    -drive if=pflash,format=raw,unit=1,file=/tmp/nexus-home/OVMF_VARS.fd \
"""

# These two experiment arms deliberately use the same QEMU/TCG, one-vCPU,
# VirtIO, Intel-IOMMU, ATA-media, and swtpm envelope as cser-production.  The
# only added devices are COM2 (tool bridge) and COM3 (host crash barrier).
[scheme."tool-dma-cser"]
build.no_default_features = true
build.features = ["cser-tool-dma-experiment"]
qemu.args = """\
    -nodefaults \
    -object memory-backend-file,id=tool-dma-ram,size=1G,mem-path=/work/artifacts/tool-dma-cser/ram.raw,offset=0,share=on,discard-data=off,readonly=off \
    -machine q35,kernel-irqchip=split,default-bus-bypass-iommu=off,memory-backend=tool-dma-ram \
    -accel tcg,thread=single \
    -cpu Icelake-Server,+x2apic \
    -m 1G \
    -smp 1 \
    -no-reboot \
    -display none \
    -monitor none \
    -chardev stdio,id=serial0,signal=off \
    -serial chardev:serial0 \
    -chardev socket,id=tool-com2,path=/work/artifacts/tool-dma-cser/com2-tool.sock,server=on,wait=on \
    -serial chardev:tool-com2 \
    -chardev socket,id=crash-com3,path=/work/artifacts/tool-dma-cser/com3-crash.sock,server=on,wait=on \
    -serial chardev:crash-com3 \
    -chardev file,id=entry-debugcon,path=/work/artifacts/tool-dma-cser/task-entry-debugcon.log \
    -device isa-debugcon,iobase=0xe9,chardev=entry-debugcon \
    -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
    -device intel-iommu,intremap=on,caching-mode=on,dma-drain=on \
    -blockdev driver=file,filename=/opt/nexus-fixtures/runtime-fs-block.raw,node-name=nexusfs-file,read-only=on,auto-read-only=off \
    -blockdev driver=raw,file=nexusfs-file,node-name=nexusfs,read-only=on \
    -device virtio-blk-pci,drive=nexusfs,bus=pcie.0,addr=05.0,bootindex=-1,disable-legacy=on,iommu_platform=on,packed=off,indirect_desc=off,event_idx=off,queue_reset=off,queue-size=16,num-queues=1,ioeventfd=off,request-merging=off,vectors=0,write-cache=off,config-wce=off,discard=off,write-zeroes=off \
    -device piix3-ide,id=legacy-ide \
    -blockdev driver=file,filename=/work/artifacts/tool-dma-cser/journal.raw,node-name=tool-journal-file,read-only=off,auto-read-only=off,cache.direct=off,cache.no-flush=off \
    -blockdev driver=raw,file=tool-journal-file,node-name=tool-journal \
    -device ide-hd,drive=tool-journal,bus=legacy-ide.0,bootindex=-1 \
    -blockdev driver=file,filename=/work/artifacts/tool-dma-cser/outbox.raw,node-name=tool-outbox-file,read-only=off,auto-read-only=off,cache.direct=off,cache.no-flush=off \
    -blockdev driver=raw,file=tool-outbox-file,node-name=tool-outbox \
    -device ide-hd,drive=tool-outbox,bus=legacy-ide.1,bootindex=-1 \
    -chardev socket,id=chrtpm,path=/work/artifacts/tool-dma-cser/swtpm-qemu.sock \
    -tpmdev emulator,id=tpm0,chardev=chrtpm \
    -device tpm-tis,tpmdev=tpm0 \
    -drive if=pflash,format=raw,unit=0,readonly=on,file=/root/ovmf/release/OVMF.fd \
    -drive if=pflash,format=raw,unit=1,file=/tmp/nexus-home/OVMF_VARS.fd \
"""

